<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers FunProject - Bouquet Generator</title>
    <!-- Google Fonts for elegant typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="logo-badge">🌸 Sweet Blossom 🌸</div>
            <h1>Bouquet Generator</h1>
            <p>Transform your name into a breathtaking, personalized digital bouquet and unravel its hidden language.</p>
        </header>

        <main class="main-content">
            <div class="input-card">
                <div class="input-group">
                    <input type="text" id="nameInput" placeholder="Type a name (e.g., AMANDA)" maxlength="20" autocomplete="off">
                    <button id="generateBtn">
                        <span>Weave Bouquet</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m12 16 4-4-4-4"/><path d="M8 12h8"/></svg>
                    </button>
                </div>
            </div>

            <!-- Central Bouquet Visualizer -->
            <div id="bouquetContainer" class="bouquet-card hidden">
                <div class="card-header">
                    <h2>Your Handcrafted Bouquet</h2>
                    <div class="ribbon-divider"><span>💝</span></div>
                </div>
                <div id="flowerCanvas" class="flower-grid"></div>
            </div>

            <!-- Flower Breakdown & Meanings -->
            <div id="meaningsContainer" class="meanings-card hidden">
                <h3>The Language of Your Bouquet</h3>
                <div class="table-wrapper">
                    <ul id="meaningsList" class="styled-list"></ul>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
